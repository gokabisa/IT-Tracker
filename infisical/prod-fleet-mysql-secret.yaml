# fleet-mysql (kabisa-app namespace), production.
#
# Previously created imperatively by .github/workflows/kabisa-deploy.yml's
# "Sync Fleet app secrets" step, from GH Actions secret FLEET_MYSQL_PASSWORD,
# on every push to main/kabisa-deploy. Replaced now that the Infisical
# Secrets Operator is installed on prod — that step is removed from the
# workflow in this same PR.
#
# Scoped to its own /fleet-mysql folder (not the project's flat root, which
# also holds KUBECONFIG_K8S and GHCR_PAT) so this k8s Secret only ever
# contains the one key the chart actually references — same reasoning as
# gokabisa/ingress-traefik's prod-slack-bug-reporter-secret.yaml.
#
# creationPolicy: Orphan — this CR's lifecycle must never risk deleting a
# secret the running Deployment depends on (staging's New-backend
# shlink-database secret had a real near-incident from the opposite policy).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: fleet-mysql
  namespace: kabisa-app
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: it-tracker-o1-yw
        envSlug: prod
        secretsPath: /fleet-mysql
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: kabisa-app
  managedSecretReference:
    secretName: fleet-mysql
    secretNamespace: kabisa-app
    creationPolicy: Orphan
    template:
      includeAllSecrets: true

# fleet-server-key (kabisa-app namespace), production.
#
# Previously created imperatively by .github/workflows/kabisa-deploy.yml's
# "Sync Fleet app secrets" step. Replaced now that the Infisical Secrets
# Operator is installed on prod — that step is removed in this same PR.
#
# Scoped to its own /fleet-server-key folder for the same reason as
# fleet-mysql's InfisicalSecret (avoid pulling KUBECONFIG_K8S/GHCR_PAT into
# an app-facing secret via includeAllSecrets on the project's flat root).
#
# Key names match exactly what the chart's fleet-server-key existingSecret
# expects (see deploy/kabisa-fleet/README.md): FLEET_SERVER_PRIVATE_KEY
# (32 chars exactly), FLEET_MDM_WINDOWS_WSTEP_IDENTITY_CERT_BYTES,
# FLEET_MDM_WINDOWS_WSTEP_IDENTITY_KEY_BYTES.
#
# creationPolicy: Orphan — same reasoning as fleet-mysql's CR.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: fleet-server-key
  namespace: kabisa-app
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: it-tracker-o1-yw
        envSlug: prod
        secretsPath: /fleet-server-key
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: kabisa-app
  managedSecretReference:
    secretName: fleet-server-key
    secretNamespace: kabisa-app
    creationPolicy: Orphan
    template:
      includeAllSecrets: true

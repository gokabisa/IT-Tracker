replicaCount: 1

image:
  repository: ghcr.io/gokabisa/fleet
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: ghcr-secret

existingSecret: fleet-server-key
mysqlSecret: fleet-mysql

mysql:
  address: 163.172.148.210:16305
  database: fleetdm
  username: fleetdm
  passwordKey: mysql-password

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 4Gi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  image:
    repository: bitnamilegacy/redis
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  global:
    security:
      allowInsecureImages: true

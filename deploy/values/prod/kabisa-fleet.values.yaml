replicaCount: 1

image:
  repository: ghcr.io/gokabisa/fleet
  pullPolicy: IfNotPresent
  # Bumped by .github/workflows/kabisa-deploy.yml's git write-back step on
  # every deploy — never set by hand except this one initial pin, matching
  # the exact SHA already live so Argo CD's first sync is a no-op adopt.
  tag: "8d4bfcbcb9ec97c10d4d42f3c4f511763d4876e2"

imagePullSecrets:
  - name: ghcr-secret

existingSecret: fleet-server-key
mysqlSecret: fleet-mysql

mysql:
  address: 163.172.148.210:16305
  database: fleetdm
  username: fleetdm
  passwordKey: mysql-password

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 4Gi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  image:
    repository: bitnamilegacy/redis
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  global:
    security:
      allowInsecureImages: true

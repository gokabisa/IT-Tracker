{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kabisa-fleet.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "kabisa-fleet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "kabisa-fleet.selectorLabels" . | nindent 8 }}
        job: migration
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.securityContext }}
      securityContext:
        runAsNonRoot: {{ .runAsNonRoot }}
        runAsUser: {{ .runAsUser }}
        runAsGroup: {{ .runAsGroup }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "kabisa-fleet.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fleet"]
          args: ["prepare", "db", "--no-prompt"]
          env:
            - name: FLEET_MYSQL_ADDRESS
              value: {{ .Values.mysql.address | quote }}
            - name: FLEET_MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: FLEET_MYSQL_USERNAME
              value: {{ .Values.mysql.username | quote }}
            - name: FLEET_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysqlSecret }}
                  key: {{ .Values.mysql.passwordKey }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: [ALL]
{{- end }}

name: Build Fleet (Kabisa arm64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v4.84.3)"
        required: true
        default: "v4.84.3"
  push:
    branches:
      - kabisa-deploy
    paths:
      - "cmd/fleet/**"
      - "server/**"
      - "frontend/**"
      - "ee/**"
      - "tools/fleet-docker/**"
      - ".github/workflows/kabisa-build-fleet.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ github.event.inputs.tag || 'v4.84.3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install JS deps
        run: make deps-js

      - name: Generate assets
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          NODE_ENV: production
        run: make generate

      - name: Build Fleet binary (linux/arm64)
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            go build -tags full,fts5,netgo -trimpath \
            -o tools/fleet-docker/fleet \
            ./cmd/fleet

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: tools/fleet-docker
          file: tools/fleet-docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/gokabisa/fleet:${{ env.TAG }}
            ghcr.io/gokabisa/fleet:latest
          provenance: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Package + push Helm chart to GHCR (OCI)
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update bitnami
          cd deploy/kabisa-fleet
          helm dependency build
          helm package .
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push kabisa-fleet-*.tgz oci://ghcr.io/gokabisa/charts

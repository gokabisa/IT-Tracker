name: Build & Deploy Fleet (Kabisa)

on:
  push:
    branches:
      - main
      - kabisa-deploy
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: commit SHA)"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/gokabisa/fleet
  # This job builds and pushes an image, bumps the image tag in git, and
  # stops — it never touches the cluster directly. Argo CD's fleet-prod
  # Application (argocd/fleet-prod-application.yaml) owns the actual sync
  # from here, same pattern as gokabisa/New-backend's kabisa-backend staging
  # cutover. Secrets (fleet-mysql, fleet-server-key, ghcr-secret) are no
  # longer this workflow's job either: fleet-mysql/fleet-server-key are
  # Infisical-managed now (infisical/prod-fleet-*-secret.yaml), and
  # ghcr-secret in kabisa-app is kept fresh by other repos' CI (e.g.
  # New-backend's deploy-k8s.yml) that still deploy to this same namespace
  # far more often than this one does.
  PROD_VALUES: deploy/values/prod/kabisa-fleet.values.yaml

permissions:
  # write: this job commits the image tag bump back to kabisa-deploy (see
  # "Bump prod image tag" below) — Argo CD syncs on that commit.
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-24.04-arm
    environment: Production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install JS deps
        run: make deps-js

      - name: Generate assets
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          NODE_ENV: production
        run: make generate

      - name: Build Fleet binary (linux/arm64, static)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -tags full,netgo,osusergo -trimpath \
            -o tools/fleet-docker/fleet \
            ./cmd/fleet
          file tools/fleet-docker/fleet

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: tools/fleet-docker
          file: tools/fleet-docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          provenance: false

      # [skip ci] stops this commit from re-triggering this same workflow
      # (this job's on.push would otherwise fire again for a commit that
      # only bumps a tag, forever). Same pattern as New-backend's
      # deploy-k8s-staging.yml tag-bump step.
      - name: Bump prod image tag (git write-back)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s|tag: \"[0-9a-f]\{40\}\"|tag: \"${{ steps.tag.outputs.tag }}\"|" ${{ env.PROD_VALUES }}
          if git diff --quiet -- ${{ env.PROD_VALUES }}; then
            echo "No tag change (already at this sha, or pattern didn't match — check ${{ env.PROD_VALUES }} by hand if unexpected)"
          else
            git add ${{ env.PROD_VALUES }}
            git commit -m "chore(argocd): bump fleet prod image tag to ${{ steps.tag.outputs.tag }} [skip ci]"
            git push origin HEAD:kabisa-deploy
          fi

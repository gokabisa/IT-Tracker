name: Build & Deploy Fleet (Kabisa)

on:
  push:
    branches:
      - main
      - kabisa-deploy
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: commit SHA)"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/gokabisa/fleet
  NAMESPACE: kabisa-app
  RELEASE: fleet
  CHART: deploy/kabisa-fleet
  PROD_VALUES: deploy/values/prod/kabisa-fleet.values.yaml

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build & Deploy to K8s
    runs-on: ubuntu-24.04-arm
    environment: Production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install JS deps
        run: make deps-js

      - name: Generate assets
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          NODE_ENV: production
        run: make generate

      - name: Build Fleet binary (linux/arm64, static)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -tags full,netgo,osusergo -trimpath \
            -o tools/fleet-docker/fleet \
            ./cmd/fleet
          file tools/fleet-docker/fleet

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: tools/fleet-docker
          file: tools/fleet-docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          provenance: false

      - name: Set up kubeconfig
        env:
          KUBECONFIG_K8S: ${{ secrets.KUBECONFIG_K8S }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_K8S" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Create image pull secret for ghcr.io
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=ProgrammerDATCH \
            --docker-password="$GHCR_PAT" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync Fleet app secrets
        env:
          FLEET_MYSQL_PASSWORD: ${{ secrets.FLEET_MYSQL_PASSWORD }}
          FLEET_SERVER_PRIVATE_KEY: ${{ secrets.FLEET_SERVER_PRIVATE_KEY }}
          FLEET_MDM_WINDOWS_WSTEP_IDENTITY_CERT_BYTES: ${{ secrets.FLEET_MDM_WINDOWS_WSTEP_IDENTITY_CERT_BYTES }}
          FLEET_MDM_WINDOWS_WSTEP_IDENTITY_KEY_BYTES: ${{ secrets.FLEET_MDM_WINDOWS_WSTEP_IDENTITY_KEY_BYTES }}
        run: |
          kubectl create secret generic fleet-mysql \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=mysql-password="$FLEET_MYSQL_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic fleet-server-key \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=FLEET_SERVER_PRIVATE_KEY="$FLEET_SERVER_PRIVATE_KEY" \
            --from-literal=FLEET_MDM_WINDOWS_WSTEP_IDENTITY_CERT_BYTES="$FLEET_MDM_WINDOWS_WSTEP_IDENTITY_CERT_BYTES" \
            --from-literal=FLEET_MDM_WINDOWS_WSTEP_IDENTITY_KEY_BYTES="$FLEET_MDM_WINDOWS_WSTEP_IDENTITY_KEY_BYTES" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm dependency update
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency update ${{ env.CHART }}

      - name: Helm upgrade
        run: |
          helm upgrade --install ${{ env.RELEASE }} ${{ env.CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.PROD_VALUES }} \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --wait --timeout 10m

      - name: Restart deployment to pick up secret changes
        run: |
          kubectl rollout restart deployment/${{ env.RELEASE }} \
            --namespace=${{ env.NAMESPACE }}

      - name: Rollout status
        run: |
          kubectl rollout status deployment/${{ env.RELEASE }} \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Pod + svc info
        run: |
          kubectl get pods,svc -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=kabisa-fleet
